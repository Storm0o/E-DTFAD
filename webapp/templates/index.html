<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTFAD — Speckle Denoising Lab</title>
    <meta name="description" content="DTFAD speckle denoising — upload, denoise, compare.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Starfield Background -->
    <div class="starfield">
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>
    </div>

    <!-- Single-page Lab -->
    <main class="lab">
        <div class="lab-header">
            <h1 class="lab-title">DTFAD</h1>
            <p class="lab-sub">Speckle Denoising Lab</p>
        </div>

        <div class="lab-grid">
            <!-- Upload -->
            <section class="card upload-card">
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-icon">
                        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    </div>
                    <p>Drop image here or click to browse</p>
                    <span class="upload-hint">PNG, JPG, TIFF — up to 10 MB</span>
                    <input type="file" id="imageInput" accept="image/*" hidden>
                </div>
                <div class="upload-preview" id="uploadPreview" style="display:none;">
                    <img id="previewImg" alt="Preview">
                    <button class="btn-x" id="removeBtn">&times;</button>
                </div>
            </section>

            <!-- Controls -->
            <section class="card config-card">
                <div class="config-title">Parameters</div>

                <div class="ctrls">
                    <div class="ctrl">
                        <span class="ctrl-label">Noise Type</span>
                        <select id="noiseType" class="ctrl-select">
                            <option value="gaussian">Gaussian</option>
                            <option value="gamma">Gamma (SAR)</option>
                        </select>
                    </div>
                    <div class="ctrl">
                        <span class="ctrl-label">Noise Level</span>
                        <input type="range" id="noiseLevel" min="0.01" max="0.3" step="0.01" value="0.04" class="ctrl-range">
                        <span class="ctrl-val" id="noiseLevelVal">0.04</span>
                    </div>
                    <div class="ctrl">
                        <span class="ctrl-label">Iterations</span>
                        <input type="range" id="nIter" min="5" max="30" step="1" value="10" class="ctrl-range">
                        <span class="ctrl-val" id="nIterVal">10</span>
                    </div>
                    <div class="ctrl">
                        <span class="ctrl-label">Time Step</span>
                        <input type="range" id="dt" min="0.01" max="0.25" step="0.01" value="0.10" class="ctrl-range">
                        <span class="ctrl-val" id="dtVal">0.10</span>
                    </div>
                </div>

                <button class="btn-go" id="processBtn" disabled>
                    Run Denoising
                </button>
            </section>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div class="loader-wrap" id="loadingOverlay" style="display:none;">
        <div class="loader-card">
            <div class="pulse-ring"></div>
            <p>Processing...</p>
        </div>
    </div>

    <!-- Results (hidden, rendered by JS) -->
    <section class="results-container" id="resultsSection" style="display:none;">
        <div class="params-row" id="paramsGrid"></div>
        <div class="img-grid" id="imagesGrid"></div>
        <div class="metrics-row" id="metricsComparison"></div>
        <div class="verdict" id="winnerBanner"></div>
    </section>

    <script src="/static/app.js"></script>
</body>
</html>
